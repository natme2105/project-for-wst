<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Average Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    input {
      margin: 5px 0;
      padding: 5px;
      width: 100px;
    }
    label {
      margin-left: 10px;
    }
    #result {
      font-weight: bold;
      margin-top: 10px;
    }
    button {
      margin-top: 10px;
      padding: 8px 15px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: darkgreen;
    }
  </style>
</head>
<body>
  <h2>Average Checker</h2>

  <div>
    <input type="number" id="g1" placeholder="Type grade 1..."> <label>Grade 1</label><br>
    <input type="number" id="g2" placeholder="Type grade 2..."> <label>Grade 2</label><br>
    <input type="number" id="g3" placeholder="Type grade 3..."> <label>Grade 3</label><br>
    <input type="number" id="g4" placeholder="Type grade 4..."> <label>Grade 4</label><br>
  </div>

  <div>
    <input type="text" id="average" readonly> <label>Average</label><br>
    <input type="text" id="finalResult" readonly> <label>Result</label><br>
  </div>

  <button onclick="calculate()">Calculate</button>

  <script>
    function calculate() {
      let g1 = document.getElementById("g1").value;
      let g2 = document.getElementById("g2").value;
      let g3 = document.getElementById("g3").value;
      let g4 = document.getElementById("g4").value;

      
      if (g1 === "" || g2 === "" || g3 === "" || g4 === "") {
        alert("⚠️ Please enter all grades before calculating!");
        return;
      }

    
      g1 = parseFloat(g1);
      g2 = parseFloat(g2);
      g3 = parseFloat(g3);
      g4 = parseFloat(g4);

      let avg = (g1 + g2 + g3 + g4) / 4;
      document.getElementById("average").value = avg.toFixed(2);

      let result = "";
      if (avg >= 60 && avg <= 74) result = "Failed";
      else if (avg >= 75 && avg <= 90) result = "Good";
      else if (avg >= 91 && avg <= 100) result = "Perfect";
      else result = "Invalid Grade";

      document.getElementById("finalResult").value = result;
    }
  </script>
</body>
</html>
